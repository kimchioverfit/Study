{{ define "main" }}
  <section class="hero">
    <h1>{{ .Site.Title }}</h1>
    <p>{{ .Site.Params.description }}</p>
  </section>
  <section class="grid">
    {{ range .Site.Sections }}
      <a class="card" href="{{ .RelPermalink }}">
        <h2>{{ .Title }}</h2>
        <p>{{ len .Pages }} pages</p>
      </a>
    {{ end }}
  </section>
{{ end }}
