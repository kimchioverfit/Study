{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </header>
  <ul class="list">
    {{ range .Pages.ByTitle }}
      {{ $title := .Title }}
      {{ if not $title }}
        {{ with .File }}{{ $title = .Path }}{{ end }}
      {{ end }}
      <li class="list-item">
        <a class="list-link" href="{{ .RelPermalink }}">{{ $title }}</a>
        {{ with .File }}<span class="meta">{{ .Path }}</span>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
