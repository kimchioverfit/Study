baseURL = "https://kimchioverfit.github.io/Study/"
languageCode = "ko-kr"
title = "Study Notes"
paginate = 20

contentDir = "."

[params]
  description = "Technical notes and study log."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

ignoreFiles = [
  "^content/",
  "^docs/",
  "^imgs/",
  "^README\\.md$",
  "^TODO\\.md$",
  "^나의임시공부파일\\.md$"
]
